[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "regalabs-tts"
version = "1.0.0"
description = "RegaLabs-TTS: CosyVoice 3 Central Kurdish (Sorani) Text-to-Speech Adaptation Tools"
authors = [{name = "RegaLabs"}]
license = {text = "Apache-2.0"}
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "torch",
    "soundfile",
    "numpy",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Audio :: Speech Synthesis",
]

[project.urls]
Homepage = "https://github.com/RegaLabs/RegaLabs-TTS"
HuggingFace = "https://huggingface.co/RegaLabs/RegaLabs-TTS"
